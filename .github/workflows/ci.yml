name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Build and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The lowest supported and latest versions (decisions 0022 and 0026).
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7
        with:
          # The changeset check compares with main.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install the pnpm version from package.json
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: pnpm install --frozen-lockfile
      - name: Check that changed packages have a changeset
        # The release pull request is the one that uses the changesets up.
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        run: pnpm changeset status --since=origin/main
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test
