name: Release

on:
  push:
    branches: [main]

permissions: {}

# One release at a time, and never stop one part way.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  select:
    name: Look for unreleased changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install the pnpm version from package.json
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: pnpm install --frozen-lockfile
      - id: select
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    name: Open or update the release pull request
    needs: select
    if: needs.select.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install the pnpm version from package.json
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: pnpm run version
          commit-message: 'chore: release'
          pr-title: 'chore: release'
